<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Infinite Jeopardy Buzzer</title>
<meta name="theme-color" content="#c7b4a2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest-play.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="apple-mobile-web-app-title" content="Jeopardy">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&display=swap">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/phone.css">
</head>
<body class="phone">
<div class="scene" id="scene" data-pose="join" aria-hidden="true">
  <div class="haze"></div><div class="cloud c1"></div>
  <div class="hill far"></div>
  <div class="hill near"></div>
  <div class="grain"></div><div class="speck"></div>
</div>

<main class="app" id="app">
  <!-- JOIN -->
  <section class="view" id="v-join">
    <h1 class="logo join-logo">Infinite <i>Jeopardy</i></h1>
    <form class="card joinform" id="join-form" autocomplete="off" novalidate>
      <button type="button" class="btn paper wide scan-btn" id="scan-btn" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><rect x="8" y="8" width="8" height="8" rx="1"/></svg>Scan the TV's QR</button>
      <div class="field">
        <label for="room">Room code</label>
        <input id="room" maxlength="4" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="ABCD" inputmode="text">
      </div>
      <div class="field">
        <label for="name">Your name</label>
        <input id="name" maxlength="16" autocomplete="nickname" autocapitalize="words" placeholder="What the TV should call you">
      </div>
      <button class="btn primary wide" id="join-btn">Join the game</button>
      <p class="err" id="join-err" role="alert"></p>
    </form>
    <button type="button" class="btn on-hill wide" id="host-resume" hidden></button>
    <button type="button" class="link install-link" id="install-link" hidden>Get the app</button>
  </section>

  <!-- GAME (player or host) -->
  <section class="view" id="v-game" hidden>
    <header class="top">
      <div class="me"><span class="me-name" id="me-name"></span><span class="me-team" id="me-team"></span></div>
      <div class="me-score num" id="me-score"></div>
    </header>
    <div class="stagep" id="stagep"></div>
    <footer class="foot">
      <span class="dot" id="dot"></span><span id="foot-text"></span>
      <button class="burger" id="menu-btn" type="button" aria-label="Menu" aria-expanded="false"><i></i><i></i><i></i></button>
    </footer>
  </section>

  <div class="sheet" id="sheet" hidden><div class="card sheet-card" id="sheet-card" role="dialog" aria-modal="true"></div></div>
</main>

<script type="module" src="/js/phone.js"></script>
</body>
</html>
